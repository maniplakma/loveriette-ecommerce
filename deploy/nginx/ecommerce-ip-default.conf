# Optional: HTTP on VPS public IP (no domain yet).
# Enable via: ENABLE_IP_DEFAULT=1 ./deploy/setup-external-access.sh
# Remove when you use a real domain in ecommerce.conf.

upstream ecommerce_app {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 12M;

    access_log /var/log/nginx/ecommerce-ip.access.log;
    error_log  /var/log/nginx/ecommerce-ip.error.log;

    location / {
        proxy_pass http://ecommerce_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
