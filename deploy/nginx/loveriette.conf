# Nginx site config for Loveriette (Ubuntu 24.04 + Contabo VPS)
#
# Install:
#   sudo cp deploy/nginx/loveriette.conf /etc/nginx/sites-available/loveriette
#   sudo ln -sf /etc/nginx/sites-available/loveriette /etc/nginx/sites-enabled/loveriette
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace YOUR_DOMAIN with your real domain before enabling SSL.

upstream loveriette_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # Certbot will add a redirect to HTTPS after: sudo certbot --nginx -d YOUR_DOMAIN -d www.YOUR_DOMAIN

    client_max_body_size 12M;

    access_log /var/log/nginx/loveriette.access.log;
    error_log  /var/log/nginx/loveriette.error.log;

    location / {
        proxy_pass http://loveriette_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}

# After Certbot, an SSL server block is added automatically.
# Ensure COOKIE_SECURE=1 in .env when HTTPS is active.
