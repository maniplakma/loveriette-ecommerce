# DEPRECATED — use loveriette.shop.conf instead
# Loveriette — root domain only (no www)
# Contabo VPS → PM2 ecommerce on port 3001
#
# Install on VPS:
#   sudo cp /var/www/ecommerce/deploy/nginx/loveriette.com.conf /etc/nginx/sites-available/loveriette
#   sudo ln -sf /etc/nginx/sites-available/loveriette /etc/nginx/sites-enabled/loveriette
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d loveriette.com

upstream loveriette_app {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name loveriette.com;

    client_max_body_size 12M;

    access_log /var/log/nginx/loveriette.access.log;
    error_log  /var/log/nginx/loveriette.error.log;

    location / {
        proxy_pass http://loveriette_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
