# Nginx — loveriette ecommerce at /var/www/ecommerce (PM2 port 3001)
# DOES NOT modify /var/www/ezyshell or its Nginx site.
#
# Quick setup (UFW + Nginx):
#   cd /var/www/ecommerce
#   SHOP_DOMAIN=shop.example.com ./deploy/setup-external-access.sh
#
# Manual install:
#   sudo cp deploy/nginx/ecommerce.conf /etc/nginx/sites-available/ecommerce
#   sudo sed -i 's/SHOP_DOMAIN/shop.example.com/g' /etc/nginx/sites-available/ecommerce
#   sudo ln -sf /etc/nginx/sites-available/ecommerce /etc/nginx/sites-enabled/ecommerce
#   sudo nginx -t && sudo systemctl reload nginx
#
# Node must bind 0.0.0.0 (HOST=0.0.0.0 in .env). Upstream uses loopback on same VPS.

upstream ecommerce_app {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name SHOP_DOMAIN www.SHOP_DOMAIN;

    client_max_body_size 12M;

    access_log /var/log/nginx/ecommerce.access.log;
    error_log  /var/log/nginx/ecommerce.error.log;

    location / {
        proxy_pass http://ecommerce_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
