# Loveriette — root domain only (no www)
# Domain: loveriette.shop
# VPS IP: 161.97.78.192
# PM2 app: ecommerce on port 3001
#
# Install on VPS:
#   sudo cp /var/www/ecommerce/deploy/nginx/loveriette.shop.conf /etc/nginx/sites-available/loveriette
#   sudo ln -sf /etc/nginx/sites-available/loveriette /etc/nginx/sites-enabled/loveriette
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d loveriette.shop

# loveriette.shop → PM2 ecommerce @ 127.0.0.1:3001
# Fix duplicate upstream: use direct proxy_pass (see deploy/nginx/fix-loveriette-shop.sh)

server {
    listen 80;
    listen [::]:80;
    server_name loveriette.shop;

    client_max_body_size 12M;

    access_log /var/log/nginx/loveriette.access.log;
    error_log  /var/log/nginx/loveriette.error.log;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
