<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apply for a Loan — loveriette</title>
  <link rel="stylesheet" href="style.css?v=20260626platform">
  <link rel="stylesheet" href="mobile.css?v=20260626platform">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="platform.css?v=20260626">
  <script src="theme.js"></script>
  <script src="theme-colors.js"></script>
  <script src="api-cache.js"></script>
</head>
<body>
  <nav class="top-nav"><div class="nav-inner"><ul class="nav-left"></ul></div></nav>
  <section class="platform-section">
    <div class="platform-section-head">
      <h1>Loan Application</h1>
      <p>Fill in your details below. We'll review your application shortly.</p>
    </div>
    <form class="platform-form" id="apply-form">
      <label>Loan Plan
        <select id="plan-select" name="planId"><option value="">Select a plan</option></select>
      </label>
      <div id="dynamic-fields"></div>
      <button type="submit" class="btn-primary-platform">Submit Application</button>
    </form>
    <p id="apply-success" hidden style="text-align:center;margin-top:2rem">
      Application submitted! Your reference: <strong id="app-ref"></strong><br>
      <a id="app-link" href="#">View application status</a>
    </p>
  </section>
  <script src="toast.js"></script>
  <script src="nav.js"></script>
  <script src="platform-nav.js"></script>
  <script src="lending-apply.js"></script>
</body>
</html>
