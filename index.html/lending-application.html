<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application Status — loveriette</title>
  <link rel="stylesheet" href="style.css?v=20260626platform">
  <link rel="stylesheet" href="platform.css?v=20260627icons">
  <script src="theme.js"></script>
  <script src="share-utils.js"></script>
</head>
<body>
  <main class="platform-section" id="app-status"><p>Loading...</p></main>
  <div id="app-share"></div>
  <footer class="site-footer"><p class="footer-copy">© 2026 LOVERIETTE. ALL RIGHTS RESERVED.</p></footer>
  <script>
    const appId = location.pathname.split('/').pop();
    function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}
    fetch('/api/lending/application/' + encodeURIComponent(appId)).then(r=>r.json()).then(d=>{
      if(d.error){document.getElementById('app-status').innerHTML='<p>Application not found.</p>';return;}
      const rows = Object.entries(d.formData||{}).map(([k,v])=>'<tr><td><strong>'+esc(k)+'</strong></td><td>'+esc(v)+'</td></tr>').join('');
      document.getElementById('app-status').innerHTML=`
        <h1>Application ${esc(d.applicationId)}</h1>
        <p>Status: <strong>${esc(d.status)}</strong> · Plan: ${esc(d.planName||'—')}</p>
        <p>Submitted: ${esc(d.createdAt)}</p>
        <table style="width:100%;margin-top:1rem;font-size:0.9rem">${rows}</table>`;
      if(window.renderShareButtons) renderShareButtons(document.getElementById('app-share'), location.pathname, 'Loan Application');
    });
  </script>
</body>
</html>
