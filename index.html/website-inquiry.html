  <main class="platform-section inquiry-chat-wrap">
    <div class="inquiry-chat-head">

      <h1 id="inquiry-title">Your Inquiry</h1>
      <p id="inquiry-meta" class="inquiry-meta"></p>
    </div>

    <div class="inquiry-chat-panel">
      <div class="inquiry-chat-messages" id="inquiry-messages" aria-live="polite">
        <p class="dashboard-loading">Loading conversation…</p>
      </div>
      <form id="inquiry-reply-form" class="inquiry-chat-compose" hidden>
        <label class="sr-only" for="inquiry-email">Your email</label>
        <input type="email" id="inquiry-email" name="email" placeholder="Your email (to verify)" required>
        <label class="sr-only" for="inquiry-message">Message</label>
        <textarea id="inquiry-message" name="message" rows="3" placeholder="Type your message…" required></textarea>
        <button type="submit" class="btn-primary-platform">Send Message</button>
      </form>
      <p id="inquiry-closed-note" class="inquiry-closed-note" hidden>This inquiry is closed. Contact us to reopen.</p>
    </div>
