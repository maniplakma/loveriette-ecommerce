<!DOCTYPE html>
<html lang="en" class="light-mode">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — loveriette</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css?v=20260615welcome-headline">
  <link rel="stylesheet" href="mobile.css?v=20260615typography">
  <link rel="stylesheet" href="theme.css">
  <script src="theme.js"></script>
  <script src="theme-colors.js?v=20260614persist"></script>
</head>
<body class="auth-page is-new-buyer">
  <div class="auth-layout">
    <aside class="auth-brand">
      <div class="auth-brand-inner">
        <div class="auth-logo store-brand">
          <span class="auth-logo-text store-brand-name brand-wordmark">loveriette</span>
        </div>
        <div class="auth-brand-hero-stack">
          <div class="brand-logos" aria-hidden="true"></div>
          <div class="auth-brand-copy">
            <h1 class="auth-welcome-title">
              <span class="auth-welcome-line auth-welcome-line--dark">Your Premium Digital</span>
              <span class="auth-welcome-line auth-welcome-line--accent">Shop for Apps</span>
              <span class="auth-welcome-line auth-welcome-line--dark">&amp; Services</span>
            </h1>
            <p>Loveriette is your go-to digital shop for premium apps, tools, and streaming services — starting from ₱50.</p>
          </div>
        </div>
      </div>
    </aside>

    <main class="auth-form-panel">
      <div class="auth-form-wrap">
        <a href="index.html" class="back-home">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          Back to Home
        </a>

        <h2>Create Account</h2>
        <p class="auth-subtitle">Sign up to start shopping on Loveriette.</p>

        <form class="auth-form" id="signup-form">
          <div class="field">
            <label for="name">Full Name</label>
            <div class="input-wrap">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
              </span>
              <input type="text" id="name" name="name" placeholder="Enter your full name" required autocomplete="name">
            </div>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <div class="input-wrap">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                  <polyline points="22,6 12,13 2,6"/>
                </svg>
              </span>
              <input type="email" id="email" name="email" placeholder="Enter your email" required autocomplete="email">
            </div>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input type="password" id="password" name="password" placeholder="Enter your password" required minlength="6" autocomplete="new-password">
              <button type="button" class="toggle-password" aria-label="Show password">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="field">
            <label for="confirm-password">Confirm Password</label>
            <div class="input-wrap">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input type="password" id="confirm-password" name="confirmPassword" placeholder="Confirm your password" required minlength="6" autocomplete="new-password">
              <button type="button" class="toggle-password" aria-label="Show password">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <p class="form-error" hidden></p>
          <button type="submit" class="auth-submit">Continue as Buyer</button>
        </form>

        <p class="auth-switch">Already have an account? <a href="login.html">Login here</a></p>
      </div>
    </main>
  </div>

  <script src="brand-logos.js"></script>
  <script src="branding.js"></script>
  <script src="notifications.js"></script>
  <script src="toast.js"></script>
  <script src="auth.js"></script>
</body>
</html>
