<!DOCTYPE html>
<html lang="en" class="light-mode">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — loveriette</title>
  <link rel="stylesheet" href="theme-critical.css?v=20260708b">
  <script src="theme-boot.js?v=20260708b"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="auth.css?v=20260708b">
  <link rel="stylesheet" href="mobile.css?v=20260708b">
  <link rel="stylesheet" href="performance-mobile.css?v=20260708b">
  <link rel="stylesheet" href="theme.css?v=20260708b">
  <script src="theme.js?v=20260708b" defer></script>
  <script src="theme-colors.js?v=20260708b" defer></script>
</head>
<body class="auth-page is-new-buyer">
  <div class="auth-layout">
    <aside class="auth-brand">
      <div class="auth-brand-inner">
        <div class="auth-brand-hero-stack">
          <div class="brand-logos" aria-hidden="true"></div>
          <div class="auth-brand-copy">
            <h1 class="hero-display auth-hero-display" data-no-flirt>
              <span class="hero-display-row">
                <span class="hero-display-stack">
                  <span class="hero-display-shadow" aria-hidden="true">Loveriette</span>
                  <span class="hero-display-bold hero-display-premiums">premiums</span>
                </span>
                <span class="hero-display-script">desire</span>
              </span>
            </h1>
            <p class="hero-tagline auth-hero-tagline">We'll email you a secure link to choose a new password.</p>
          </div>
        </div>
      </div>
    </aside>

    <main class="auth-form-panel">
      <div class="auth-form-wrap">
        <a href="login.html" class="back-home">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          Back to sign in
        </a>

        <h2>Forgot password</h2>
        <p class="auth-subtitle">Enter the email on your account. We'll send a reset link to your inbox (check spam too).</p>

        <form class="auth-form" id="forgot-password-form">
          <div class="field">
            <label for="email">Email</label>
            <div class="input-wrap">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                  <polyline points="22,6 12,13 2,6"/>
                </svg>
              </span>
              <input type="email" id="email" name="email" placeholder="you@email.com" required autocomplete="email">
            </div>
          </div>

          <p class="form-error" hidden></p>
          <p class="form-success" id="forgot-success" hidden></p>
          <button type="submit" class="auth-submit">Send reset link</button>
        </form>

        <p class="auth-switch">Remember your password? <a href="login.html">Sign in</a></p>
      </div>
    </main>
  </div>

  <script src="brand-logos.js"></script>
  <script src="branding.js?v=20260703audit" defer></script>
  <script src="notifications.js"></script>
  <script src="toast.js"></script>
  <script src="auth.js?v=20260710reset"></script>
</body>
</html>
