<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart — loveriette</title>
  <link rel="stylesheet" href="style.css?v=20260615brand-gloss">
  <link rel="stylesheet" href="mobile.css?v=20260615typography">
  <link rel="stylesheet" href="theme.css">
  <script src="theme.js"></script>
  <script src="theme-colors.js?v=20260614persist"></script>
</head>
<body>
  <nav class="top-nav">
    <div class="nav-inner">
      <ul class="nav-left">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="index.html#products" class="nav-link">Products</a></li>
        <li><a href="faqs.html" class="nav-link">FAQs</a></li>
        <li><a href="guide.html" class="nav-link">Guide</a></li>
        <li><a href="about.html" class="nav-link">About Us</a></li>
        <li><a href="contact.html" class="nav-link">Contact</a></li>
      </ul>
      <ul class="nav-right">
        <li>
          <button class="icon-btn cart-btn active-nav" type="button" aria-label="Cart">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
            </svg>
            <span class="cart-count">0</span>
          </button>
        </li>
        <li class="auth-guest"><a href="login.html" class="nav-link">Sign In</a></li>
        <li class="auth-guest"><a href="signup.html" class="nav-signup">Sign Up</a></li>
        <li class="auth-user" hidden><a href="dashboard.html" class="nav-link nav-account-link">My Account</a></li>
        <li class="auth-user" hidden><button class="nav-link logout-btn" type="button">Logout</button></li>
      </ul>
    </div>
  </nav>

  <main class="cart-page">
    <header class="cart-page-header">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
      </svg>
      <h1>Shopping Cart (<span id="cart-title-count">0</span>)</h1>
    </header>

    <div class="cart-list" id="cart-list"></div>
    <p class="cart-empty-page" id="cart-empty" hidden>Your cart is empty.</p>

    <div class="cart-summary-card" id="cart-summary" hidden>
      <div class="cart-summary-left">
        <span class="summary-label">Estimated Total</span>
        <strong class="summary-amount" id="cart-total">₱0</strong>
      </div>
      <p class="cart-summary-note">Checkout is done per product. Click &quot;Buy&quot; on each item.</p>
    </div>
  </main>

  <footer class="site-footer">
    <p class="footer-copy">© 2026 LOVERIETTE. ALL RIGHTS RESERVED.</p>
    <div class="footer-links">
      <a href="privacy.html">Privacy Policy</a>
      <a href="terms.html">Terms of Service</a>
    </div>
  </footer>

  <script src="notifications.js"></script>
  <script src="toast.js"></script>
  <script src="branding.js"></script>
  <script src="nav.js"></script>
  <script src="mobile.js?v=20260614mobile"></script>
  <script src="cart.js?v=20260615cart-variant"></script>
</body>
</html>
