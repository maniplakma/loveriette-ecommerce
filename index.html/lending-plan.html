<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loan Plan — loveriette</title>
  <link rel="stylesheet" href="style.css?v=20260626platform">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="platform.css?v=20260627icons">
  <script src="theme.js"></script>
  <script src="share-utils.js"></script>
</head>
<body>
  <nav class="top-nav"><div class="nav-inner"><ul class="nav-left"></ul></div></nav>
  <main class="platform-section" id="plan-content"><p>Loading...</p></main>
  <div id="plan-share"></div>
  <footer class="site-footer"><p class="footer-copy">© 2026 LOVERIETTE. ALL RIGHTS RESERVED.</p></footer>
  <script src="nav.js"></script>
  <script src="platform-nav.js"></script>
  <script>
    const slug = location.pathname.split('/').pop();
    function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}
    fetch('/api/lending/plans/' + encodeURIComponent(slug)).then(r=>r.json()).then(p=>{
      if(p.error){document.getElementById('plan-content').innerHTML='<p>Plan not found.</p>';return;}
      document.title = p.name + ' — loveriette';
      if(window.applySeoMeta) applySeoMeta({title:document.title, description:p.description, url:p.shareUrl});
      document.getElementById('plan-content').innerHTML=`
        <a href="/lending">← Back to Lending</a>
        <h1>${esc(p.name)}</h1>
        <p>${esc(p.description)}</p>
        <div class="stats-grid" style="margin:1.5rem 0">
          <div class="stat-card"><div class="stat-card-value">${p.interestRate}%</div><div class="stat-card-label">Interest Rate</div></div>
          <div class="stat-card"><div class="stat-card-value">₱${Number(p.adminFee).toLocaleString()}</div><div class="stat-card-label">Admin Fee</div></div>
          <div class="stat-card"><div class="stat-card-value">${p.termMonths}mo</div><div class="stat-card-label">Term</div></div>
        </div>
        <ul class="package-features">${(p.features||[]).map(f=>'<li>'+esc(f)+'</li>').join('')}</ul>
        <a href="/lending/apply?plan=${esc(p.slug)}" class="btn-primary-platform">Apply Now</a>`;
      if(window.renderShareButtons) renderShareButtons(document.getElementById('plan-share'), p.shareUrl, p.name);
    });
    document.addEventListener('DOMContentLoaded',()=>initPlatformNav('lending'));
  </script>
</body>
</html>
