<!DOCTYPE html>
<html lang="en" class="light-mode">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — loveriette</title>
  <link rel="stylesheet" href="theme-critical.css?v=20260708b">
  <script src="theme-boot.js?v=20260708b"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="auth.css?v=20260708b">
  <link rel="stylesheet" href="mobile.css?v=20260708b">
  <link rel="stylesheet" href="performance-mobile.css?v=20260708b">
  <link rel="stylesheet" href="theme.css?v=20260708b">
  <script src="theme.js?v=20260708b" defer></script>
  <script src="theme-colors.js?v=20260708b" defer></script>
</head>
<body class="auth-page is-new-buyer">
  <div class="auth-layout">
    <aside class="auth-brand">
      <div class="auth-brand-inner">
        <div class="auth-brand-hero-stack">
          <div class="brand-logos" aria-hidden="true"></div>
          <div class="auth-brand-copy">
            <h1 class="hero-display auth-hero-display" data-no-flirt>
              <span class="hero-display-row">
                <span class="hero-display-stack">
                  <span class="hero-display-shadow" aria-hidden="true">Loveriette</span>
                  <span class="hero-display-bold hero-display-premiums">premiums</span>
                </span>
                <span class="hero-display-script">desire</span>
              </span>
            </h1>
            <p class="hero-tagline auth-hero-tagline">Choose a new password for your account.</p>
          </div>
        </div>
      </div>
    </aside>

    <main class="auth-form-panel">
      <div class="auth-form-wrap">
        <a href="login.html" class="back-home">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          Back to sign in
        </a>

        <h2>New password</h2>
        <p class="auth-subtitle" id="reset-subtitle">Enter your new password below. Link expires in 1 hour.</p>

        <form class="auth-form" id="reset-password-form" hidden>
          <input type="hidden" id="reset-token" name="token">

          <div class="field">
            <label for="password">New password</label>
            <div class="input-wrap">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input type="password" id="password" name="password" placeholder="At least 8 characters" required autocomplete="new-password" minlength="8">
              <button type="button" class="toggle-password" aria-label="Show password">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="field">
            <label for="confirmPassword">Confirm password</label>
            <div class="input-wrap">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat password" required autocomplete="new-password" minlength="8">
            </div>
          </div>

          <p class="form-error" hidden></p>
          <button type="submit" class="auth-submit">Update password</button>
        </form>

        <div id="reset-invalid" hidden>
          <p class="form-error" style="display:block">This reset link is invalid or expired.</p>
          <p class="auth-switch"><a href="forgot-password.html">Request a new reset link</a></p>
        </div>

        <p class="auth-switch">Remember your password? <a href="login.html">Sign in</a></p>
      </div>
    </main>
  </div>

  <script src="brand-logos.js"></script>
  <script src="branding.js?v=20260703audit" defer></script>
  <script src="notifications.js"></script>
  <script src="toast.js"></script>
  <script src="auth.js?v=20260710reset"></script>
</body>
</html>
