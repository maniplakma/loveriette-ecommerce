<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — loveriette</title>
  <link rel="stylesheet" href="style.css?v=20260627icons">
  <link rel="stylesheet" href="mobile.css?v=20260626platform">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="platform.css?v=20260627icons">
  <script src="theme.js"></script>
  <script src="theme-colors.js"></script>
  <script src="api-cache.js"></script>
  <script src="share-utils.js"></script>
</head>
<body>
  <nav class="top-nav">
    <div class="nav-inner">
      <ul class="nav-left"></ul>
      <ul class="nav-right">
        <li>
          <button class="icon-btn cart-btn" type="button" aria-label="Cart" onclick="location.href='cart.html'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
            </svg>
            <span class="cart-count">0</span>
          </button>
        </li>
        <li class="auth-guest"><a href="login.html" class="nav-link">Sign In</a></li>
        <li class="auth-guest"><a href="signup.html" class="nav-signup">Sign Up</a></li>
        <li class="auth-user" hidden><a href="dashboard.html" class="nav-link">My Account</a></li>
        <li class="auth-user" hidden><button class="nav-link logout-btn" type="button">Logout</button></li>
      </ul>
    </div>
  </nav>

  <main class="product-page">
    <a href="/shop" class="back-explore">← Back to Shop</a>

    <div class="product-hero" id="product-hero" hidden>
      <div class="product-hero-logo">
        <div class="product-logo" id="product-logo">N</div>
      </div>
      <div class="explore-services">
        <span class="explore-label">Explore Other Services</span>
        <div class="explore-services-grid" id="explore-services-grid"></div>
      </div>
    </div>

    <div class="product-about-box" id="product-about" hidden>
      <h2>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>
        About <span id="about-name"></span>
      </h2>
      <p id="product-description"></p>
    </div>

    <section class="plans-section" id="plans-section" hidden>
      <h2 class="plans-section-title"><span class="plans-bar"></span> Available Variants</h2>
      <div class="plans-grid" id="plans-grid"></div>
    </section>

    <section class="product-reviews platform-section" id="product-reviews-section" hidden style="padding:2rem 0">
      <h2 class="plans-section-title"><span class="plans-bar"></span> Customer Reviews</h2>
      <div class="reviews-grid" id="product-reviews-list"></div>
    </section>

    <section class="platform-section" id="related-products-section" hidden style="padding:2rem 0">
      <h2 class="plans-section-title"><span class="plans-bar"></span> Related Products</h2>
      <div class="related-products-grid" id="related-products-grid"></div>
    </section>

    <p class="empty-state" id="product-error" hidden>Product not found.</p>

    <div id="product-share"></div>
  </main>

  <footer class="site-footer">
    <p class="footer-copy">© 2026 LOVERIETTE. ALL RIGHTS RESERVED.</p>
    <div class="footer-links">
      <a href="privacy.html">Privacy Policy</a>
      <a href="terms.html">Terms of Service</a>
    </div>
  </footer>

  <script src="flirty-copy.js"></script>
  <script src="notifications.js"></script>
  <script src="toast.js"></script>
  <script src="branding.js"></script>
  <script src="badges.js"></script>
  <script src="nav.js"></script>
  <script src="mobile.js"></script>
  <script src="platform-nav.js"></script>
  <script src="product-icons.js"></script>
  <script src="product.js?v=20260626slug"></script>
</body>
</html>
